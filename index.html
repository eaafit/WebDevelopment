<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа - Управление файлами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-box">
        <h1>Система управления документами</h1>

        <div class="upload-zone">
            <p>Перетащите файлы сюда (PDF или Изображения)</p>
            <p>или</p>
            <input type="file" accept=".pdf, image/*" multiple>
            <p class="info-text">Макс. размер: 10 МБ. Форматы: PDF, JPEG, PNG</p>
        </div>

        <!-- Раздел для списка файлов -->
        <h2>Загруженные документы</h2>
        <div class="file-list-empty">
            <p>Нет загруженных документов</p>
        </div>

    </div>

</body>
</html>
